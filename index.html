<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Фурри-Прикола</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            text-align: center;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        h1 { 
            color: #ff79c6; 
            text-shadow: 2px 2px #bd93f9; 
            margin-bottom: 5px;
        }
        #score-container { 
            font-size: 2em; 
            margin-bottom: 40px; 
            color: #50fa7b; 
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        #furry-btn {
            font-size: 120px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.05s;
            filter: drop-shadow(0 0 20px #ff79c6);
            outline: none;
        }
        #furry-btn:active { 
            transform: scale(0.85) rotate(10deg); 
        }
        
        #shop {
            margin-top: 50px;
            padding: 20px;
            border: 3px dashed #ffb86c;
            border-radius: 15px;
            background: rgba(255, 184, 108, 0.15);
            box-shadow: 0 0 15px rgba(255, 184, 108, 0.3);
        }
        .upgrade {
            font-size: 1.1em;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: #ffb86c;
            color: #282c34;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        .upgrade:hover { background-color: #f1fa8c; transform: scale(1.05); }
        .upgrade:disabled { background-color: #6272a4; color: #a5b0cb; cursor: not-allowed; transform: none; }

        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            text-shadow: 2px 2px 0px #000;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Симулятор Суетолога 🦊</h1>
    <div id="score-container">Уровень пушистости: <span id="uwu-count">0</span> UwU</div>
    
    <button id="furry-btn">🐾</button>

    <div id="shop">
        <h3 style="margin-top: 0;">Магазин Приколов</h3>
        <button class="upgrade" id="upgrade1" onclick="buyAutoUwU()" disabled>
            Нанять лисичку-помощницу (Цена: <span id="price">15</span> UwU)
        </button>
        <p id="auto-stats" style="margin-bottom: 0;">Авто-UwU в секунду: 0</p>
    </div>

<script>
    let score = 0;
    let autoUwU = 0;
    let price = 15;
    
    const scoreEl = document.getElementById('uwu-count');
    const btn = document.getElementById('furry-btn');
    const upgrade1Btn = document.getElementById('upgrade1');
    const autoStatsEl = document.getElementById('auto-stats');
    const priceEl = document.getElementById('price');

    // Набор мемных фраз для всплывающего текста
    const phrases = ["OwO", "UwU", "*кусь*", "Фыр-фыр!", "Awww~", "*виляет хвостом*", "Суетолог!", "Оу май", "nya~", "🐾"];
    // Эмодзи для изменения мордочки
    const faces = ["🐾", "🦊", "🐺", "🐶", "🐱", "🦁", "🐯", "🦝"];

    // Обработка клика по главной кнопке
    btn.addEventListener('click', (e) => {
        score++;
        updateScore();
        createFloatingText(e.clientX, e.clientY);
        changeFace();
    });

    // Обновление счетчика и проверка доступности покупки
    function updateScore() {
        scoreEl.innerText = score;
        if (score >= price) {
            upgrade1Btn.disabled = false;
        } else {
            upgrade1Btn.disabled = true;
        }
    }

    // Создание отлетающего текста
    function createFloatingText(x, y) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        
        // Немного разбрасываем текст вокруг курсора
        const offsetX = (Math.random() - 0.5) * 80;
        const offsetY = (Math.random() - 0.5) * 80;
        
        el.style.left = (x + offsetX) + 'px';
        el.style.top = (y + offsetY) + 'px';
        
        // Случайный яркий цвет
        const colors = ['#ff79c6', '#bd93f9', '#8be9fd', '#50fa7b', '#f1fa8c', '#ffb86c'];
        el.style.color = colors[Math.floor(Math.random() * colors.length)];

        document.body.appendChild(el);

        // Удаляем элемент после завершения анимации (1.5 сек)
        setTimeout(() => {
            el.remove();
        }, 1400);
    }

    // С шансом 30% меняем картинку кнопки на случайного зверя
    function changeFace() {
        if (Math.random() > 0.7) {
            btn.innerText = faces[Math.floor(Math.random() * faces.length)];
        }
    }

    // Покупка автоматического кликера
    function buyAutoUwU() {
        if (score >= price) {
            score -= price;
            autoUwU += 1;
            
            // Увеличиваем цену на 10 каждую покупку, чтобы было интереснее
            price += 10; 
            priceEl.innerText = price;
            
            updateScore();
            autoStatsEl.innerText = "Авто-UwU в секунду: " + autoUwU;
        }
    }

    // Цикл работы автокликера (вызывается каждую секунду)
    setInterval(() => {
        if (autoUwU > 0) {
            score += autoUwU;
            updateScore();
            
            // Создаем всплывающий текст от автокликов прямо из центра кнопки
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            // Если автокликов много, не будем спамить текстом слишком сильно
            if(Math.random() > 0.4) {
                createFloatingText(cx, cy);
            }
        }
    }, 1000);

    // Начальная проверка
    updateScore();
</script>
</body>
</html>
