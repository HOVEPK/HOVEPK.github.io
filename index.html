<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Nova: Bulletproof Edition</title>
    <style>
        /* === БАЗОВЫЕ НАСТРОЙКИ === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: #0f0c29;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: manipulation; /* Запрет зума на телефоне */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === ИНТЕРФЕЙС === */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #ff79c6;
            border-color: #ff79c6;
            box-shadow: 0 0 10px #ff79c6;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            gap: 20px;
        }

        .panel {
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            flex: 1 1 300px; /* Адаптивность: панели сжимаются и переносятся */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* === ЛЕВАЯ ПАНЕЛЬ (ИГРА) === */
        .game-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #ff79c6;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.6);
            margin-bottom: 5px;
        }

        .level-box {
            background: linear-gradient(90deg, #bd93f9, #ff79c6);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .score-box {
            margin-bottom: 30px;
        }

        #score {
            font-size: 4rem;
            font-weight: 900;
            color: #50fa7b;
            line-height: 1;
            text-shadow: 0 0 15px rgba(80, 250, 123, 0.4);
        }

        #bps {
            color: #bd93f9;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .main-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff79c6, #bd93f9);
            border: none;
            font-size: 6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.4);
            transition: transform 0.05s;
            position: relative;
        }

        .main-btn:active {
            transform: scale(0.9);
        }

        .reset-btn {
            background: transparent;
            border: none;
            color: #888;
            text-decoration: underline;
            margin-top: 25px;
            cursor: pointer;
            padding: 10px;
        }

        /* === ПРАВАЯ ПАНЕЛЬ (МАГАЗИН И ТОП) === */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        h2 {
            font-size: 1.3rem;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .shop-icon { font-size: 2rem; margin-right: 15px; }
        .shop-info { flex: 1; }
        .shop-name { font-weight: bold; }
        .shop-desc { font-size: 0.8rem; color: #50fa7b; }
        
        .buy-btn {
            background: #ff79c6;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            min-width: 80px;
            text-align: center;
        }
        .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .buy-btn span { display: block; font-size: 0.75rem; font-weight: normal; }

        .lb-row {
            display: flex;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }
        .lb-row.me { background: rgba(255,121,198,0.2); border-radius: 8px; font-weight: bold; }
        .lb-rank { width: 30px; color: #aaa; }
        .lb-name { flex: 1; }
        .lb-score { color: #50fa7b; font-family: monospace; font-size: 1.1rem; }

        /* === ЭФФЕКТЫ === */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            color: #ff79c6;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 1000;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-es" onclick="setLang('es')">ES</button>
    </div>

    <div class="main-container">
        
        <div class="panel game-panel">
            <h1>Aurora Nova</h1>
            <div class="level-box"><span id="txt-lvl">Уровень</span>: <span id="ui-lvl">1</span></div>
            
            <div class="score-box">
                <div id="score">0</div>
                <div style="color: #aaa; font-size: 0.9rem;" id="txt-collected">UwU собрано</div>
                <div id="bps">0 <span id="txt-sec">UwU/сек</span></div>
            </div>

            <button class="main-btn" id="click-btn">🐾</button>

            <button class="reset-btn" id="txt-reset" onclick="hardReset()">Сбросить прогресс</button>
        </div>

        <div class="panel side-panel">
            <div>
                <h2 id="txt-shop">🛒 Магазин</h2>
                <div id="shop-list"></div>
            </div>

            <div>
                <h2 id="txt-top">🏆 Топ Суетологов</h2>
                <div id="leaderboard"></div>
            </div>
        </div>

    </div>

<script>
    // === 1. СЛОВАРЬ (ЯЗЫКИ) ===
    const i18n = {
        ru: {
            lvl: "Уровень", col: "UwU собрано", sec: "UwU/сек", reset: "Сбросить прогресс",
            shop: "🛒 Магазин", top: "🏆 Топ Игроков", me: "Ты",
            u1: "Лисичка", u2: "Энергетик", u3: "Завод", u4: "Кибер-Лапа",
            d1: "+1 UwU/с", d2: "+10 UwU/с", d3: "+100 UwU/с", d4: "+1000 UwU/с"
        },
        en: {
            lvl: "Level", col: "UwU Collected", sec: "UwU/sec", reset: "Reset Progress",
            shop: "🛒 Shop", top: "🏆 Leaderboard", me: "You",
            u1: "Fox", u2: "Energy Drink", u3: "Factory", u4: "Cyber-Paw",
            d1: "+1 UwU/s", d2: "+10 UwU/s", d3: "+100 UwU/s", d4: "+1000 UwU/s"
        },
        es: {
            lvl: "Nivel", col: "UwU Recolectado", sec: "UwU/seg", reset: "Reiniciar",
            shop: "🛒 Tienda", top: "🏆 Clasificación", me: "Tú",
            u1: "Zorro", u2: "Bebida", u3: "Fábrica", u4: "Ciber-Pata",
            d1: "+1 UwU/s", d2: "+10 UwU/s", d3: "+100 UwU/s", d4: "+1000 UwU/s"
        }
    };

    // Проверяем сохраненный язык (защита от ошибок)
    let validLangs = ['ru', 'en', 'es'];
    let savedLang = localStorage.getItem('uwuLangSafe');
    let currentLang = validLangs.includes(savedLang) ? savedLang : 'ru';

    // === 2. БАЗА ДАННЫХ ИГРЫ ===
    const upgradesDB = [
        { id: 1, icon: '🦊', basePrice: 15, bps: 1, nameKey: 'u1', descKey: 'd1' },
        { id: 2, icon: '⚡', basePrice: 150, bps: 10, nameKey: 'u2', descKey: 'd2' },
        { id: 3, icon: '🏭', basePrice: 1500, bps: 100, nameKey: 'u3', descKey: 'd3' },
        { id: 4, icon: '🤖', basePrice: 20000, bps: 1000, nameKey: 'u4', descKey: 'd4' }
    ];

    let state = {
        score: 0,
        counts: { 1: 0, 2: 0, 3: 0, 4: 0 },
        botScores: [50000, 10000, 2000, 500]
    };

    // Высчитываем BPS на основе покупок
    function getCalculatedBps() {
        let total = 0;
        upgradesDB.forEach(u => { total += u.bps * state.counts[u.id]; });
        return total;
    }

    // Высчитываем цену
    function getPrice(id) {
        let base = upgradesDB.find(u => u.id === id).basePrice;
        return Math.floor(base * Math.pow(1.15, state.counts[id]));
    }

    // === 3. СОХРАНЕНИЕ И ЗАГРУЗКА (СУПЕРБЕЗОПАСНАЯ) ===
    function loadGame() {
        try {
            let saved = localStorage.getItem('uwuSafeSave_v2');
            if (saved) {
                let parsed = JSON.parse(saved);
                // Проверяем, что сохранение не битое
                if (typeof parsed.score === 'number' && parsed.counts) {
                    state.score = parsed.score;
                    state.counts = Object.assign(state.counts, parsed.counts);
                    if (parsed.botScores) state.botScores = parsed.botScores;
                }
            }
        } catch (e) {
            console.log("Сохранение было сломано, начинаем заново.");
            localStorage.removeItem('uwuSafeSave_v2');
        }
    }

    function saveGame() {
        try { localStorage.setItem('uwuSafeSave_v2', JSON.stringify(state)); } catch (e) {}
    }

    function hardReset() {
        if (confirm("Точно удалить всё? / Are you sure?")) {
            localStorage.removeItem('uwuSafeSave_v2');
            location.reload();
        }
    }

    // === 4. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ===
    function updateUI() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        document.getElementById('bps').innerHTML = `${getCalculatedBps().toLocaleString()} <span id="txt-sec">${i18n[currentLang].sec}</span>`;
        document.getElementById('ui-lvl').innerText = Math.max(1, Math.floor(Math.log10(state.score + 1)) + 1);

        // Обновляем кнопки в магазине
        upgradesDB.forEach(u => {
            let btn = document.getElementById(`buy-${u.id}`);
            if (btn) btn.disabled = state.score < getPrice(u.id);
        });
    }

    function renderShop() {
        let html = '';
        upgradesDB.forEach(u => {
            let price = getPrice(u.id);
            html += `
                <div class="shop-item">
                    <div class="shop-icon">${u.icon}</div>
                    <div class="shop-info">
                        <div class="shop-name">${i18n[currentLang][u.nameKey]}</div>
                        <div class="shop-desc">${i18n[currentLang][u.descKey]}</div>
                    </div>
                    <button class="buy-btn" id="buy-${u.id}" onclick="buyItem(${u.id})">
                        ${price.toLocaleString()} UwU
                        <span>ЛВЛ ${state.counts[u.id]}</span>
                    </button>
                </div>
            `;
        });
        document.getElementById('shop-list').innerHTML = html;
        updateUI(); // Применяем доступность кнопок
    }

    function renderLeaderboard() {
        let botsNames = ["Bot Alpha", "Bot OwO", "Bot Pro", "Bot Noob"];
        let players = state.botScores.map((s, i) => ({ name: botsNames[i], score: s, isMe: false }));
        players.push({ name: i18n[currentLang].me, score: state.score, isMe: true });
        
        players.sort((a, b) => b.score - a.score);
        
        let html = '';
        players.slice(0, 5).forEach((p, i) => {
            html += `
                <div class="lb-row ${p.isMe ? 'me' : ''}">
                    <div class="lb-rank">#${i + 1}</div>
                    <div class="lb-name">${p.name}</div>
                    <div class="lb-score">${Math.floor(p.score).toLocaleString()}</div>
                </div>
            `;
        });
        document.getElementById('leaderboard').innerHTML = html;
    }

    // === 5. ИГРОВЫЕ ДЕЙСТВИЯ ===
    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('uwuLangSafe', lang);
        
        // Подсвечиваем кнопку
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`lang-${lang}`).classList.add('active');

        // Меняем статические тексты
        document.getElementById('txt-lvl').innerText = i18n[lang].lvl;
        document.getElementById('txt-collected').innerText = i18n[lang].col;
        document.getElementById('txt-reset').innerText = i18n[lang].reset;
        document.getElementById('txt-shop').innerText = i18n[lang].shop;
        document.getElementById('txt-top').innerText = i18n[lang].top;

        renderShop();
        renderLeaderboard();
        updateUI();
    }

    function buyItem(id) {
        let price = getPrice(id);
        if (state.score >= price) {
            state.score -= price;
            state.counts[id]++;
            saveGame();
            renderShop();
        }
    }

    // Клик по главной кнопке (используем стандартные события для 100% совместимости)
    const clickBtn = document.getElementById('click-btn');
    
    function handleTap(e) {
        state.score++;
        updateUI();
        
        // Эффект вылетающих частиц
        let x = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
        let y = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
        
        let p = document.createElement('div');
        p.className = 'particle';
        p.innerText = ["UwU", "🐾", "✨"][Math.floor(Math.random() * 3)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);

        // Меняем мордочку
        if(Math.random() > 0.8) {
            clickBtn.innerText = ["🐾", "🦊", "🐺", "🐶"][Math.floor(Math.random() * 4)];
        }
    }

    // Привязываем и клик, и тач (с защитой от двойного срабатывания)
    clickBtn.addEventListener('mousedown', (e) => handleTap(e));
    clickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, {passive: false});

    // === 6. ЦИКЛЫ ===
    // Автокликер (10 раз в сек)
    setInterval(() => {
        let bps = getCalculatedBps();
        if (bps > 0) {
            state.score += bps / 10;
            updateUI();
        }
    }, 100);

    // Боты и сохранение (1 раз в сек)
    setInterval(() => {
        let powers = [100, 25, 10, 2];
        for(let i=0; i<4; i++) {
            state.botScores[i] += powers[i] + Math.random() * powers[i];
        }
        renderLeaderboard();
        saveGame();
    }, 1000);

    // === 7. ЗАПУСК ===
    loadGame();
    setLang(currentLang); // Запустит первичную отрисовку всего

</script>
</body>
</html>
