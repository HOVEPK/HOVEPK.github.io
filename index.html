<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Nova: Global Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0c29;
            --pink: #ff79c6;
            --purple: #bd93f9;
            --green: #50fa7b;
            --text: #f8f8f2;
            --panel-bg: rgba(20, 20, 35, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            /* Анимированный градиентный фон */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Фоновые летающие частицы */
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 121, 198, 0.1);
            animation: floatBubble infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* Переключатель языков */
        .lang-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .lang-btn.active {
            background: var(--pink);
            box-shadow: 0 0 15px var(--pink);
            border-color: var(--pink);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 60px 20px 20px 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            align-items: start;
            z-index: 10;
        }

        /* Глассморфизм */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s;
        }
        
        .glass-panel:hover { transform: translateY(-2px); }

        /* --- ЛЕВАЯ ЧАСТЬ --- */
        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            position: relative;
        }

        .header h1 {
            color: var(--pink);
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 121, 198, 0.5);
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { text-shadow: 0 0 15px rgba(255, 121, 198, 0.5); }
            50% { text-shadow: 0 0 25px rgba(255, 121, 198, 0.9), 0 0 5px white; }
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(45deg, var(--purple), var(--pink));
            padding: 5px 15px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(189, 147, 249, 0.4);
        }

        .score-display { margin: 20px 0; }
        #score {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--green);
            line-height: 1;
            text-shadow: 0 0 20px rgba(80, 250, 123, 0.5);
            transition: 0.1s;
        }
        
        #bps { font-size: 1.2rem; color: var(--purple); font-weight: 700; margin-top: 5px; }
        .text-muted { color: #aaa; font-size: 0.9rem; }

        /* Анимированная кнопка клика */
        .click-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Пульсирующее кольцо сзади */
        .click-halo {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--pink), var(--purple));
            opacity: 0.5;
            filter: blur(20px);
            animation: pulseHalo 3s infinite;
        }

        @keyframes pulseHalo {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        .clicker-btn {
            position: relative;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(189,147,249,0.9), rgba(255,121,198,0.9));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6.5rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.4);
            transition: transform 0.05s, filter 0.1s;
            touch-action: manipulation;
            z-index: 2;
        }

        .clicker-btn:active {
            transform: scale(0.85);
            filter: brightness(1.2);
        }

        .reset-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            margin-top: 15px;
            transition: 0.2s;
        }
        .reset-btn:hover { color: var(--pink); }

        /* --- ПРАВАЯ ЧАСТЬ --- */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 15px; border-bottom: 2px solid var(--panel-border); padding-bottom: 10px; }

        /* Магазин */
        .upgrade-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .upgrade-item:hover { background: rgba(255,255,255,0.05); border-color: var(--purple); }
        
        .upgrade-icon { font-size: 2.5rem; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: bold; font-size: 1.1rem; }
        .upgrade-desc { font-size: 0.85rem; color: var(--green); opacity: 0.9; }
        
        .buy-btn {
            background: var(--pink);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            box-shadow: 0 4px 15px rgba(255, 121, 198, 0.3);
        }
        
        .buy-btn:active:not(:disabled) { transform: scale(0.9); }
        .buy-btn:hover:not(:disabled) { background: #ff8ad0; box-shadow: 0 6px 20px rgba(255, 121, 198, 0.6); }
        .buy-btn:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; opacity: 0.7; }
        
        .buy-btn .cost { font-size: 1rem; }
        .buy-btn .lvl { font-size: 0.75rem; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 6px; margin-top: 3px; }

        /* Эффект покупки */
        @keyframes buyPop { 0% { transform: scale(1); background: white; } 50% { transform: scale(1.05); background: var(--green); } 100% { transform: scale(1); } }
        .pop-anim { animation: buyPop 0.3s ease; }

        /* Таблица лидеров */
        .lb-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; transition: 0.3s; }
        .lb-row:last-child { border-bottom: none; }
        .lb-row:hover { background: rgba(255,255,255,0.05); transform: translateX(5px); }
        
        .lb-row.me { background: rgba(255, 121, 198, 0.15); border-radius: 10px; border: 1px solid rgba(255, 121, 198, 0.3); }
        .lb-rank { width: 25px; color: #888; text-align: center; font-weight: bold; }
        .lb-name { flex: 1; font-weight: 600; }
        .lb-score { color: var(--green); font-family: monospace; font-size: 1.2rem; font-weight: bold; }

        /* Всплывающие частицы */
        .particle {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            color: var(--pink);
            font-size: 1.5rem;
            animation: floatAndRotate 0.8s ease-out forwards;
            z-index: 9999;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        @keyframes floatAndRotate {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(-20deg); opacity: 1; }
            50% { transform: translate(-50%, -80px) scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -120px) scale(1) rotate(20deg); opacity: 0; }
        }

        /* Адаптивность */
        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; padding-top: 70px; }
            .header h1 { font-size: 2.2rem; }
            .clicker-btn { width: 170px; height: 170px; font-size: 5rem; }
            .click-wrapper { width: 200px; height: 200px; }
            #score { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="lang-ru" onclick="changeLang('ru')">RU</button>
    <button class="lang-btn" id="lang-en" onclick="changeLang('en')">EN</button>
    <button class="lang-btn" id="lang-es" onclick="changeLang('es')">ES</button>
</div>

<div id="bg-bubbles"></div>

<div class="container">
    <div class="glass-panel game-section">
        <div class="header">
            <h1>Aurora Nova</h1>
            <div class="level-badge"><span id="t-lvl">Уровень:</span> <span id="lvl-display">1</span></div>
        </div>

        <div class="score-display">
            <div id="score">0</div>
            <div class="text-muted" id="t-collected">UwU собрано</div>
            <div id="bps">0 <span id="t-persec">UwU / сек</span></div>
        </div>

        <div class="click-wrapper">
            <div class="click-halo"></div>
            <div class="clicker-btn" id="main-btn">🐾</div>
        </div>

        <button class="reset-btn" id="t-reset" onclick="hardReset()">Сбросить прогресс</button>
    </div>

    <div class="sidebar">
        <div class="glass-panel">
            <h2 id="t-shop">🛒 Магазин</h2>
            <div id="shop-container"></div>
        </div>

        <div class="glass-panel">
            <h2 id="t-top">🏆 Топ Суетологов</h2>
            <div id="lb-container"></div>
        </div>
    </div>
</div>

<script>
    // --- СЛОВАРЬ ПЕРЕВОДОВ ---
    const i18n = {
        ru: {
            lvl: "Уровень:",
            collected: "UwU собрано",
            perSec: "UwU / сек",
            reset: "Сбросить прогресс",
            shop: "🛒 Магазин",
            top: "🏆 Топ Суетологов",
            me: "Ты (Игрок)",
            confirm: "Точно сбросить весь прогресс?",
            upgrades: {
                1: { name: "Лисичка", desc: "+1 UwU/сек" },
                2: { name: "Энергетик", desc: "+10 UwU/сек" },
                3: { name: "Завод Суеты", desc: "+100 UwU/сек" },
                4: { name: "Кибер-Лапа", desc: "+1000 UwU/сек" }
            },
            bots: ["Альфа Волк", "ОуО Мастер", "Енот-Вор", "Ленивый Кот"]
        },
        en: {
            lvl: "Level:",
            collected: "UwU Collected",
            perSec: "UwU / sec",
            reset: "Reset Progress",
            shop: "🛒 Shop",
            top: "🏆 Leaderboard",
            me: "You (Player)",
            confirm: "Are you sure you want to reset all progress?",
            upgrades: {
                1: { name: "Little Fox", desc: "+1 UwU/sec" },
                2: { name: "Energy Drink", desc: "+10 UwU/sec" },
                3: { name: "UwU Factory", desc: "+100 UwU/sec" },
                4: { name: "Cyber-Paw", desc: "+1000 UwU/sec" }
            },
            bots: ["Alpha Wolf", "OwO Master", "Thief Raccoon", "Lazy Cat"]
        },
        es: {
            lvl: "Nivel:",
            collected: "UwU Recolectado",
            perSec: "UwU / seg",
            reset: "Reiniciar Progreso",
            shop: "🛒 Tienda",
            top: "🏆 Clasificación",
            me: "Tú (Jugador)",
            confirm: "¿Estás seguro de que quieres restablecer todo?",
            upgrades: {
                1: { name: "Zorrito", desc: "+1 UwU/seg" },
                2: { name: "Bebida Energética", desc: "+10 UwU/seg" },
                3: { name: "Fábrica UwU", desc: "+100 UwU/seg" },
                4: { name: "Ciber-Pata", desc: "+1000 UwU/seg" }
            },
            bots: ["Lobo Alfa", "Maestro OwO", "Mapache Ladrón", "Gato Perezoso"]
        }
    };

    let currentLang = localStorage.getItem('uwuLang') || 'ru';

    // --- СОСТОЯНИЕ ИГРЫ ---
    let state = {
        score: 0,
        bps: 0,
        counts: { 1: 0, 2: 0, 3: 0, 4: 0 }, // Сохраняем только количество покупок
        botScores: [50000, 10000, 2000, 500]
    };

    // Базовые данные апгрейдов и ботов (не меняются)
    const upgradeBase = {
        1: { icon: '🦊', basePrice: 15, bps: 1 },
        2: { icon: '⚡', basePrice: 150, bps: 10 },
        3: { icon: '🏭', basePrice: 1500, bps: 100 },
        4: { icon: '🤖', basePrice: 20000, bps: 1000 }
    };
    const botPower = [100, 25, 10, 2];

    const btn = document.getElementById('main-btn');
    const scoreEl = document.getElementById('score');
    const bpsEl = document.getElementById('bps');
    const lvlEl = document.getElementById('lvl-display');
    const shopContainer = document.getElementById('shop-container');
    const lbContainer = document.getElementById('lb-container');

    // --- ФОНОВЫЕ ПУЗЫРЬКИ ---
    function createBgBubbles() {
        const container = document.getElementById('bg-bubbles');
        for (let i = 0; i < 15; i++) {
            let b = document.createElement('div');
            b.className = 'bg-bubble';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.width = b.style.height = (Math.random() * 40 + 10) + 'px';
            b.style.animationDuration = (Math.random() * 10 + 5) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(b);
        }
    }

    // --- СМЕНА ЯЗЫКА ---
    function changeLang(lang) {
        currentLang = lang;
        localStorage.setItem('uwuLang', lang);
        
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`lang-${lang}`).classList.add('active');

        // Обновляем статические тексты
        document.getElementById('t-lvl').innerText = i18n[lang].lvl;
        document.getElementById('t-collected').innerText = i18n[lang].collected;
        document.getElementById('t-persec').innerText = i18n[lang].perSec;
        document.getElementById('t-reset').innerText = i18n[lang].reset;
        document.getElementById('t-shop').innerText = i18n[lang].shop;
        document.getElementById('t-top').innerText = i18n[lang].top;

        renderShop();
        renderLeaderboard();
    }

    // --- ЛОГИКА ---
    function loadGame() {
        const saved = localStorage.getItem('uwuNovaSaveData');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.score = parsed.score || 0;
            state.bps = parsed.bps || 0;
            state.counts = parsed.counts || { 1: 0, 2: 0, 3: 0, 4: 0 };
            state.botScores = parsed.botScores || [50000, 10000, 2000, 500];
        }
        changeLang(currentLang);
        createBgBubbles();
    }

    function saveGame() { localStorage.setItem('uwuNovaSaveData', JSON.stringify(state)); }

    function hardReset() {
        if(confirm(i18n[currentLang].confirm)) {
            localStorage.removeItem('uwuNovaSaveData');
            location.reload();
        }
    }

    function getPrice(id) {
        return Math.floor(upgradeBase[id].basePrice * Math.pow(1.15, state.counts[id]));
    }

    function buy(id, btnElement) {
        const price = getPrice(id);
        if (state.score >= price) {
            state.score -= price;
            state.counts[id]++;
            state.bps += upgradeBase[id].bps;
            
            // Анимация успешной покупки
            btnElement.parentElement.classList.add('pop-anim');
            setTimeout(() => btnElement.parentElement.classList.remove('pop-anim'), 300);

            saveGame();
            updateUI();
            renderShop();
        }
    }

    // --- ОТРИСОВКА ---
    function updateUI() {
        scoreEl.innerText = Math.floor(state.score).toLocaleString();
        
        // Анимация дергания счета при клике
        scoreEl.style.transform = 'scale(1.1)';
        setTimeout(() => scoreEl.style.transform = 'scale(1)', 50);

        bpsEl.innerHTML = `${state.bps.toLocaleString()} <span id="t-persec" class="text-muted">${i18n[currentLang].perSec}</span>`;
        lvlEl.innerText = Math.max(1, Math.floor(Math.log10(state.score + 1)) + 1);

        // Обновляем доступность кнопок
        [1, 2, 3, 4].forEach(id => {
            const btn = document.getElementById(`buy-btn-${id}`);
            if (btn) btn.disabled = state.score < getPrice(id);
        });
    }

    function renderShop() {
        shopContainer.innerHTML = '';
        [1, 2, 3, 4].forEach(id => {
            const price = getPrice(id);
            const data = i18n[currentLang].upgrades[id];
            const base = upgradeBase[id];
            
            shopContainer.innerHTML += `
                <div class="upgrade-item" id="upg-item-${id}">
                    <div class="upgrade-icon">${base.icon}</div>
                    <div class="upgrade-info">
                        <div class="upgrade-name">${data.name}</div>
                        <div class="upgrade-desc">${data.desc}</div>
                    </div>
                    <button id="buy-btn-${id}" class="buy-btn" onclick="buy(${id}, this)" ${state.score < price ? 'disabled' : ''}>
                        <span class="cost">${price.toLocaleString()}</span>
                        <span class="lvl">LVL ${state.counts[id]}</span>
                    </button>
                </div>
            `;
        });
    }

    function renderLeaderboard() {
        let players = state.bot
