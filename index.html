<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UwU Clicker: Mobile & PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121218;
            --pink: #ff79c6;
            --purple: #bd93f9;
            --green: #50fa7b;
            --text: #f8f8f2;
            --panel-bg: rgba(30, 30, 42, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Убираем синее выделение при тапе на телефоне */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            /* Градиентный фон */
            background-image: radial-gradient(circle at top left, #2a1a3a, var(--bg-dark)),
                              radial-gradient(circle at bottom right, #3a1c2a, var(--bg-dark));
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Глассморфизм для панелей */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- ЛЕВАЯ ЧАСТЬ (ИГРА) --- */
        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .header h1 {
            color: var(--pink);
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 121, 198, 0.5);
        }
        .level-badge {
            display: inline-block;
            background: linear-gradient(45deg, var(--purple), var(--pink));
            padding: 5px 15px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .score-display {
            margin: 20px 0;
        }
        #score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--green);
            line-height: 1;
            text-shadow: 0 0 20px rgba(80, 250, 123, 0.4);
        }
        #bps {
            font-size: 1.2rem;
            color: var(--purple);
            font-weight: 700;
        }

        /* Кнопка клика */
        .clicker-btn {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.2);
            transition: transform 0.05s;
            touch-action: manipulation; /* Запрещает двойной тап для зума */
        }
        .clicker-btn:active {
            transform: scale(0.9);
        }

        .reset-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            margin-top: 10px;
        }

        /* --- ПРАВАЯ ЧАСТЬ (МАГАЗИН И ТОП) --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 10px;
        }

        /* Магазин */
        .upgrade-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .upgrade-icon { font-size: 2.5rem; }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: bold; font-size: 1.1rem; }
        .upgrade-desc { font-size: 0.85rem; color: #aaa; }
        
        .buy-btn {
            background: var(--pink);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .buy-btn .cost { font-size: 0.9rem; }
        .buy-btn .lvl { font-size: 0.7rem; opacity: 0.8; }

        /* Таблица лидеров */
        .lb-row {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            gap: 10px;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-row.me {
            background: rgba(255, 121, 198, 0.2);
            border-radius: 8px;
            font-weight: bold;
        }
        .lb-rank { width: 20px; color: #888; text-align: center;}
        .lb-name { flex: 1; }
        .lb-score { color: var(--green); font-family: monospace; font-size: 1.1rem; }

        /* Всплывающие частицы */
        .particle {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            color: var(--pink);
            font-size: 1.5rem;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 9999;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1.5); opacity: 0; }
        }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr; /* В одну колонку */
                padding: 10px;
            }
            .header h1 { font-size: 2rem; }
            .clicker-btn { width: 180px; height: 180px; font-size: 5rem; }
            #score { font-size: 3rem; }
            .sidebar { padding-bottom: 30px; } /* Место для прокрутки вниз */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-panel game-section">
        <div class="header">
            <h1>Aurora Nova</h1>
            <div class="level-badge">Уровень: <span id="lvl-display">1</span></div>
        </div>

        <div class="score-display">
            <div id="score">0</div>
            <div>UwU собрано</div>
            <div id="bps">0 UwU / сек</div>
        </div>

        <div class="clicker-btn" id="main-btn">🐾</div>

        <button class="reset-btn" onclick="hardReset()">Сбросить прогресс</button>
    </div>

    <div class="sidebar">
        <div class="glass-panel">
            <h2>🛒 Магазин</h2>
            <div id="shop-container"></div>
        </div>

        <div class="glass-panel">
            <h2>🏆 Топ Суетологов</h2>
            <div id="lb-container"></div>
        </div>
    </div>
</div>

<script>
    // 1. НАСТРОЙКИ И СОХРАНЕНИЯ
    const btn = document.getElementById('main-btn');
    const scoreEl = document.getElementById('score');
    const bpsEl = document.getElementById('bps');
    const lvlEl = document.getElementById('lvl-display');
    const shopContainer = document.getElementById('shop-container');
    const lbContainer = document.getElementById('lb-container');

    // Базовые данные игры
    let state = {
        score: 0,
        bps: 0,
        level: 1,
        upgrades: [
            { id: 1, icon: '🦊', name: 'Лисичка', desc: '+1 UwU/сек', basePrice: 15, bps: 1, count: 0 },
            { id: 2, icon: '⚡', name: 'Энергетик', desc: '+10 UwU/сек', basePrice: 150, bps: 10, count: 0 },
            { id: 3, icon: '🏭', name: 'Завод Суеты', desc: '+100 UwU/сек', basePrice: 1500, bps: 100, count: 0 },
            { id: 4, icon: '🤖', name: 'Кибер-Лапа', desc: '+1000 UwU/сек', basePrice: 20000, bps: 1000, count: 0 }
        ],
        bots: [
            { name: "Альфа Волк", score: 50000, power: 100 },
            { name: "ОуО Мастер", score: 10000, power: 25 },
            { name: "Енот-Вор", score: 2000, power: 10 },
            { name: "Ленивый Кот", score: 500, power: 2 }
        ],
        lastSave: Date.now()
    };

    // Загрузка сохранений
    function loadGame() {
        try {
            const saved = localStorage.getItem('uwuMobileSave');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.score = parsed.score || 0;
                state.bps = parsed.bps || 0;
                // Восстанавливаем покупки
                if (parsed.upgrades) state.upgrades = parsed.upgrades;
                if (parsed.bots) state.bots = parsed.bots;
            }
        } catch (e) {
            console.error("Ошибка загрузки", e);
        }
        updateUI();
        renderShop();
    }

    function saveGame() {
        try {
            localStorage.setItem('uwuMobileSave', JSON.stringify(state));
        } catch (e) {}
    }

    function hardReset() {
        if(confirm("Точно сбросить весь прогресс?")) {
            localStorage.removeItem('uwuMobileSave');
            location.reload();
        }
    }

    // 2. ИГРОВАЯ ЛОГИКА
    function getPrice(upg) {
        return Math.floor(upg.basePrice * Math.pow(1.15, upg.count));
    }

    function buy(id) {
        const upg = state.upgrades.find(u => u.id === id);
        const price = getPrice(upg);
        
        if (state.score >= price) {
            state.score -= price;
            upg.count++;
            state.bps += upg.bps;
            saveGame();
            updateUI();
            renderShop(); // Обновляем цены
        }
    }

    // 3. ОТРИСОВКА ИНТЕРФЕЙСА
    function updateUI() {
        // Округляем счет для красоты
        scoreEl.innerText = Math.floor(state.score).toLocaleString();
        bpsEl.innerText = state.bps.toLocaleString() + " UwU / сек";
        
        // Уровень зависит от очков
        state.level = Math.max(1, Math.floor(Math.log10(state.score + 1)) + 1);
        lvlEl.innerText = state.level;

        // Включаем/выключаем кнопки в магазине
        state.upgrades.forEach(upg => {
            const btn = document.getElementById(`buy-btn-${upg.id}`);
            if (btn) btn.disabled = state.score < getPrice(upg);
        });
    }

    function renderShop() {
        shopContainer.innerHTML = '';
        state.upgrades.forEach(upg => {
            const price = getPrice(upg);
            shopContainer.innerHTML += `
                <div class="upgrade-item">
                    <div class="upgrade-icon">${upg.icon}</div>
                    <div class="upgrade-info">
                        <div class="upgrade-name">${upg.name}</div>
                        <div class="upgrade-desc">${upg.desc}</div>
                    </div>
                    <button id="buy-btn-${upg.id}" class="buy-btn" onclick="buy(${upg.id})" ${state.score < price ? 'disabled' : ''}>
                        <span class="cost">${price.toLocaleString()}</span>
                        <span class="lvl">ЛВЛ ${upg.count}</span>
                    </button>
                </div>
            `;
        });
    }

    function renderLeaderboard() {
        // Собираем всех (игрока и ботов) в один массив
        let allPlayers = [
            ...state.bots, 
            { name: "Ты (Игрок)", score: state.score, isMe: true }
        ];
        
        // Сортируем по убыванию
        allPlayers.sort((a, b) => b.score - a.score);
        
        lbContainer.innerHTML = '';
        allPlayers.slice(0, 5).forEach((p, index) => {
            lbContainer.innerHTML += `
                <div class="lb-row ${p.isMe ? 'me' : ''}">
                    <div class="lb-rank">#${index + 1}</div>
                    <div class="lb-name">${p.name}</div>
                    <div class="lb-score">${Math.floor(p.score).toLocaleString()}</div>
                </div>
            `;
        });
    }

    // 4. ЭФФЕКТЫ
    function spawnParticle(x, y) {
        const p = document.createElement('div');
        p.className = 'particle';
        const phrases = ["UwU", "🐾", "Фыр!", "OwO"];
        p.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        
        // Немного рандома в координаты
        p.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
        p.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }

    // Pointerdown идеально работает и для мышки на ПК, и для пальца на телефоне (без задержки)
    btn.addEventListener('pointerdown', (e) => {
        state.score++;
        updateUI();
        spawnParticle(e.clientX, e.clientY);
        
        // Меняем мордочку иногда
        if (Math.random() > 0.8) {
            const faces = ["🐾", "🦊", "🐺", "🐶", "🐱"];
            btn.innerText = faces[Math.floor(Math.random() * faces.length)];
        }
    });

    // 5. ИГРОВЫЕ ЦИКЛЫ
    
    // Автокликер (10 раз в секунду для плавности счета)
    setInterval(() => {
        if (state.bps > 0) {
            state.score += state.bps / 10;
            updateUI();
        }
    }, 100);

    // Боты, таблица лидеров и сохранение (раз в секунду)
    setInterval(() => {
        state.bots.forEach(b => {
            b.score += b.power + Math.random() * (b.power / 2);
        });
        renderLeaderboard();
        saveGame();
    }, 1000);

    // ЗАПУСК
    loadGame();
    renderLeaderboard();

</script>
</body>
</html>
