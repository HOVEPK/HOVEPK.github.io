<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UwU Clicker: Aurora Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES --- */
        :root {
            --bg-color: #0b0b0f;
            --primary-color: #ff79c6; /* Неоново-розовый */
            --secondary-color: #bd93f9; /* Фиолетовый */
            --accent-color: #50fa7b; /* Неоново-зеленый */
            --text-color: #f8f8f2;
            --text-muted: #abb1b8;
            --glass-bg: rgba(30, 30, 40, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 20px;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --glow-color: rgba(255, 121, 198, 0.5);
            --font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND --- */
        .background-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 10%, rgba(189, 147, 249, 0.1) 0%, rgba(0,0,0,0) 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 121, 198, 0.1) 0%, rgba(0,0,0,0) 40%),
                var(--bg-color);
            z-index: -1;
        }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 95%;
            height: 90vh;
            display: grid;
            grid-template-areas:
                "header header header"
                "main main sidebar";
            grid-template-rows: 80px 1fr;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1400px;
        }

        /* --- GLASS EFFECT --- */
        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            box-shadow: 0 10px 40px 0 var(--shadow-color);
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass:hover {
            box-shadow: 0 15px 50px 0 var(--shadow-color);
        }

        /* --- HEADER --- */
        .app-header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .app-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            text-shadow: 0 0 15px var(--glow-color);
            font-weight: 700;
        }

        .level-indicator {
            font-size: 1.1rem;
            color: white;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 0 15px var(--shadow-color);
        }

        /* --- MAIN AREA --- */
        .game-area {
            grid-area: main;
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 20px;
        }

        .clicker-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .counter-container {
            margin-bottom: 30px;
        }

        #score {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(80, 250, 123, 0.5);
            display: block;
        }

        .counter-container .label {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: -5px;
            display: block;
        }

        #bps {
            font-size: 1.3rem;
            color: var(--secondary-color);
            font-weight: 600;
        }

        .click-target {
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
        }

        .click-target:active {
            transform: scale(0.92);
        }

        .click-shape {
            position: relative;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #bd93f9 0%, #ff79c6 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px var(--shadow-color), inset 0 0 20px rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        .click-shape::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .main-emoji {
            font-size: 9rem;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
        }

        .reset-data {
            font-size: 0.8rem;
            color: #555;
            cursor: pointer;
            margin-top: 15px;
        }
        .reset-data:hover { color: #888; }

        /* Stats */
        .stats-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .stat-item {
            text-align: left;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
        }

        .stat-item h2 { font-size: 1rem; color: var(--text-color); margin-bottom: 5px; }
        .stat-item p { font-size: 1.1rem; color: var(--accent-color); font-weight: bold;}

        /* --- SIDEBAR --- */
        .sidebar-area {
            grid-area: sidebar;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            overflow: hidden;
        }

        .sidebar-section h2 {
            color: var(--text-color);
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 5px;
        }

        /* Upgrades */
        .upgrades-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
            height: calc(100% - 40px);
        }

        .upgrade-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            display: grid;
            grid-template-areas:
                "icon name name"
                "icon desc bonus"
                "icon cost cost";
            grid-template-columns: 60px 1fr auto;
            gap: 5px 10px;
            transition: all 0.2s ease;
        }

        .upgrade-item:hover {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .upgrade-item .upgrade-icon { grid-area: icon; font-size: 3rem; display: flex; align-items: center; justify-content: center; }
        .upgrade-item .upgrade-name { grid-area: name; font-size: 1rem; color: var(--text-color); font-weight: 600; }
        .upgrade-item .upgrade-desc { grid-area: desc; font-size: 0.8rem; color: var(--text-muted); }
        .upgrade-item .upgrade-cost { grid-area: cost; font-size: 0.9rem; color: var(--accent-color); font-weight: bold; }
        .upgrade-item .upgrade-level { font-size: 0.8rem; color: #fff; background: var(--secondary-color); padding: 2px 6px; border-radius: 6px;}

        .upgrade-item button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .upgrade-item button:hover:not(:disabled) { background-color: #ff8ad0; }
        .upgrade-item button:active:not(:disabled) { transform: scale(0.95); }

        .upgrade-item button:disabled {
            background-color: #6272a4;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Leaderboard */
        .leaderboard-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            height: calc(100% - 40px);
            padding-right: 5px;
        }

        .leaderboard-row {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 6px 12px;
            display: grid;
            grid-template-columns: 25px 35px 1fr auto;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .leaderboard-row.me {
            background: rgba(255, 121, 198, 0.15);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 121, 198, 0.2);
        }

        .leaderboard-rank { width: 20px; color: var(--text-muted); font-size: 0.9rem; }
        .leaderboard-icon { font-size: 1.8rem; }
        .leaderboard-name { flex: 1; color: var(--text-color); font-size: 0.95rem; font-weight: 500;}
        .leaderboard-score { color: var(--accent-color); font-weight: 600; font-size: 1rem;}

        /* Particles */
        .uwu-particle {
            position: fixed;
            pointer-events: none;
            font-family: var(--font-family);
            font-weight: bold;
            color: var(--primary-color);
            animation: particleUp 1s ease-out forwards;
            z-index: 100;
            user-select: none;
        }

        @keyframes particleUp {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 3px;}
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px;}
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    </style>
</head>
<body>
    <div class="background-gradient"></div>
    <div class="app-container">
        <header class="app-header glass">
            <h1>Aurora Nova</h1>
            <div class="level-indicator">ЛВЛ: <span id="player-level">1</span></div>
        </header>
        
        <main class="game-area">
            <section class="clicker-section glass">
                <div class="counter-container">
                    <span id="score">0</span>
                    <span class="label">UwU добыто</span>
                    <span id="bps">0 UwU/сек</span>
                </div>
                <div class="click-target" id="click-target">
                    <div class="click-shape">
                        <span class="main-emoji">🐾</span>
                    </div>
                </div>
                <div class="reset-data" onclick="resetGame()">[Сброс]</div>
            </section>
            
            <section class="stats-section glass">
                <div class="stat-item">
                    <h2>Время в игре:</h2>
                    <p id="play-time">00:00:00</p>
                </div>
                <div class="stat-item">
                    <h2>Всего кликов:</h2>
                    <p id="total-clicks">0</p>
                </div>
            </section>
        </main>
        
        <aside class="sidebar-area">
            <section class="sidebar-section glass">
                <h2>Магазин</h2>
                <div class="upgrades-list" id="upgrades-list">
                    </div>
            </section>
            
            <section class="sidebar-section glass">
                <h2>Топ Суетологов</h2>
                <div class="leaderboard-table" id="leaderboard-table">
                    </div>
            </section>
        </aside>
    </div>

    <script>
        // --- 1. CONFIGURATION & CONSTANTS ---
        const CLICK_TARGET = document.getElementById('click-target');
        const SCORE_EL = document.getElementById('score');
        const BPS_EL = document.getElementById('bps');
        const PLAYER_LEVEL_EL = document.getElementById('player-level');
        const TOTAL_CLICKS_EL = document.getElementById('total-clicks');
        const PLAY_TIME_EL = document.getElementById('play-time');
        const UPGRADES_LIST_EL = document.getElementById('upgrades-list');
        const LEADERBOARD_TABLE_EL = document.getElementById('leaderboard-table');

        // Initial Game State (if no save)
        const initialState = {
            score: 0,
            bps: 0,
            totalClicks: 0,
            playerLevel: 1,
            upgrades: [
                { id: '1', name: 'Сильные Лапки', desc: '+1 UwU/сек', baseCost: 15, costMultiplier: 1.15, bonusBps: 1, icon: '🐾', level: 0 },
                { id: '2', name: 'Лисичка-Хелпер', desc: '+10 UwU/сек', baseCost: 150, costMultiplier: 1.2, bonusBps: 10, icon: '🦊', level: 0 },
                { id: '3', name: 'Мяу-Фабрика', desc: '+100 UwU/сек', baseCost: 1500, costMultiplier: 1.25, bonusBps: 100, icon: '🏭', level: 0 },
                { id: '4', name: 'Кибер-Лапа', desc: '+1000 UwU/сек', baseCost: 20000, costMultiplier: 1.3, bonusBps: 1000, icon: '🤖', level: 0 }
            ],
            leaderboard: [
                { name: "Альфа Волк", score: 10000000, icon: '🐺', basePower: 5000 },
                { name: "ОуО Мастер", score: 5000000, icon: '🦊', basePower: 2500 },
                { name: "Хитрый Енот", score: 1000000, icon: '🦝', basePower: 1000 },
                { name: "Кот Баюн", score: 250000, icon: '🐱', basePower: 500 },
                { name: "Просто Пельмень", score: 50000, icon: '🥟', basePower: 100 },
                { name: "Твой Прогресс", score: 0, icon: '👤', isMe: true }
            ],
            lastSaveTime: Date.now(),
            startTime: Date.now()
        };

        let gameState = { ...initialState };

        // --- 2. GAME LOGIC ---

        function gameTick() {
            // Auto Income (bps / 10 because tick is 100ms)
            gameState.score += gameState.bps / 10;
            
            // Bot Income simulation (bots get a small random bump every second)
            if (Date.now() - gameState.lastSaveTime > 1000) {
                gameState.leaderboard.forEach(p => {
                    if (!p.isMe) {
                        p.score += p.basePower + Math.floor(Math.random() * p.basePower);
                    }
                });
                renderLeaderboard();
            }

            // Time in game
            const playTimeSeconds = Math.floor((Date.now() - gameState.startTime) / 1000);
            PLAY_TIME_EL.innerText = formatTime(playTimeSeconds);

            // Leveling (simple logarithmic scale)
            gameState.playerLevel = Math.floor(Math.log10(gameState.score + 1)) + 1;
            PLAYER_LEVEL_EL.innerText = gameState.playerLevel;

            // Save Progress (every 5 seconds)
            if (Date.now() - gameState.lastSaveTime > 5000) {
                saveGame();
                gameState.lastSaveTime = Date.now();
            }

            updateInterface();
        }

        // --- 3. UI FUNCTIONS ---

        function updateInterface() {
            SCORE_EL.innerText = Math.floor(gameState.score).toLocaleString();
            BPS_EL.innerText = gameState.bps.toLocaleString() + ' UwU/сек';
            TOTAL_CLICKS_EL.innerText = gameState.totalClicks;
            
            updateShopButtons();
        }

        function renderUpgrades() {
            UPGRADES_LIST_EL.innerHTML = '';
            gameState.upgrades.forEach(upgrade => {
                const upgradeEl = document.createElement('div');
                upgradeEl.className = 'upgrade-item glass';
                upgradeEl.innerHTML = `
                    <div class="upgrade-icon">${upgrade.icon}</div>
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                    <div class="upgrade-cost">${Math.floor(getCurrentUpgradeCost(upgrade)).toLocaleString()} UwU</div>
                    <div class="bonus-buy" style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="upgrade-level">ЛВЛ: ${upgrade.level}</span>
                        <button onclick="buyUpgrade('${upgrade.id}')" ${gameState.score < getCurrentUpgradeCost(upgrade) ? 'disabled' : ''}>Купить</button>
                    </div>
                `;
                UPGRADES_LIST_EL.appendChild(upgradeEl);
            });
        }

        function updateShopButtons() {
            gameState.upgrades.forEach(upgrade => {
                const upgradeCost = getCurrentUpgradeCost(upgrade);
                const button = UPGRADES_LIST_EL.querySelector(`button[onclick="buyUpgrade('${upgrade.id}')"]`);
                if (button) {
                    button.disabled = gameState.score < upgradeCost;
                }
            });
        }

        function renderLeaderboard() {
            LEADERBOARD_TABLE_EL.innerHTML = '';
            
            // Update player score in leaderboard data
            const myRankIndex = gameState.leaderboard.findIndex(p => p.isMe);
            if (myRankIndex !== -1) {
                gameState.leaderboard[myRankIndex].score = Math.floor(gameState.score);
            }
            
            // Sort leaderboard by score (desc)
            gameState.leaderboard.sort((a, b) => b.score - a.score);

            // Render rows
            gameState.leaderboard.forEach((player, index) => {
                const rowEl = document.createElement('div');
                rowEl.className = `leaderboard-row glass ${player.isMe ? 'me' : ''}`;
                rowEl.innerHTML = `
                    <span class="leaderboard-rank">${index + 1}</span>
                    <span class="leaderboard-icon">${player.icon}</span>
                    <span class="leaderboard-name">${player.name}</span>
                    <span class="leaderboard-score">${Math.floor(player.score).toLocaleString()}</span>
                `;
                LEADERBOARD_TABLE_EL.appendChild(rowEl);
            });
        }

        // --- 4. PLAYER INTERACTIONS ---

        function buyUpgrade(upgradeId) {
            const upgradeIndex = gameState.upgrades.findIndex(u => u.id === upgradeId);
            if (upgradeIndex === -1) return;

            const upgrade = gameState.upgrades[upgradeIndex];
            const cost = getCurrentUpgradeCost(upgrade);

            if (gameState.score >= cost) {
                gameState.score -= cost;
                upgrade.level += 1;
                gameState.bps += upgrade.bonusBps;
                
                renderUpgrades();
                saveGame();
                updateInterface();
            }
        }

        // --- 5. HELPERS ---

        function getCurrentUpgradeCost(upgrade) {
            return
